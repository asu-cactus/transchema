# datamorpherconfig.yaml
# Fine-tuning config for DataMorpher pipeline synthesis on Qwen2.5-7B-Instruct
# Run via:  python train/train_datamorpheragent.py

env:
  HF_HOME: "/scratch/general/vast/u1592362/hf_cache"
  # No OpenAI key needed — all components run locally on the vLLM-served Qwen
  # OPENAI_API_KEY: ""
  CUDA_VISIBLE_DEVICES: '0'
  HYDRA_FULL_ERROR: 1
  N_GPUS: 1
  # The model to fine-tune (served by vLLM and used as the trainable planner)
  BASE_MODEL: 'Qwen/Qwen2.5-7B-Instruct'
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'DataMorpherAgent'
  PROJECT_NAME: 'DataMorpherAgent'
  # Path to the parquet files produced by prepare_rl_data.py
  BASE_DATA_DIR: 'train/data'
  VERBOSITY: 'DEBUG'
  N_WORKERS: 2

  # Full operator tool suite for DataMorpher pipeline synthesis.
  ENABLE_TOOLS: [
    "Configure_Join_Operator_Tool",
    "Configure_Union_Operator_Tool",
    "Configure_GroupBy_Aggregate_Operator_Tool",
    "Add_Pivot_Tool",
    "Add_Unpivot_Tool",
    "Code_Gen_And_Score_Tool",
    "Critique_Pipeline_Tool"
  ]

  # "Default" means each tool uses its own built-in default engine (the vLLM-served Qwen)
  TOOL_ENGINE: ["Default"]

  # [planner_main, planner_fixed, verifier, executor]
  # All four entries are "trainable" so every component routes through the same
  # local vLLM-served Qwen2.5-7B-Instruct — no external API calls at all.
  MODEL_ENGINE: ["trainable", "trainable", "trainable", "trainable"]

  # Pipeline synthesis typically resolves in 1-3 steps; keep low to avoid context overflow
  TOOL_STEPS: 3

  # Temperature schedule: explore during training, greedy at eval
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7

  # "final" mode returns the final generated pipeline code block
  OUTPUT_TYPE: "final"

  # Timeout per rollout in seconds (pipeline code gen + execution can take ~30-60 s)
  AGENT_MAX_TIMEOUT: 500

  # Paths to store checkpoints and rollout logs. Use scratch space if available.
  # We use env vars so the launch script can easily redirect these.
  CHECKPOINT_DIR: "/scratch/general/vast/u1592362/AgentFlow_Checkpoints"
  ROLLOUT_DIR: "/scratch/general/vast/u1592362/AgentFlow_Rollouts"

python_args:
  agentflow.port: 9999

  algorithm.adv_estimator: 'grpo'

  # Parquet files prepared by prepare_rl_data.py
  data.train_files: '${BASE_DATA_DIR}/train/datamorphertrain.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/datamorpherval.parquet'

  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'

  # Batch and rollout sizing for single GPU (observed ~95GB usable on current node)
  # 4 tasks × 4 rollouts = 16 sequences per step (GRPO works fine with this)
  # With 192GB we could go larger, but keep conservative for stability
  data.train_batch_size: 4
  actor_rollout_ref.rollout.n: 4
  actor_rollout_ref.actor.ppo_mini_batch_size: 4
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 2
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 2

  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'

  # veRL sets vLLM max_model_len = max_prompt_length + max_response_length.
  # Qwen2.5-7B supports 128K; the ceiling is this config, not the model or GPU.
  # 12288 + 1024 = 13312.  use_remove_padding=True keeps training fast.
  data.max_prompt_length: 12288
  # Generated pipelines are usually <512 tokens in smoke/early training.
  data.max_response_length: 1024
  data.truncation: 'truncate'

  # Run a validation pass before the first training step to get a baseline score
  trainer.val_before_train: True

  # Optimiser
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.model.use_remove_padding: True
  actor_rollout_ref.actor.use_kl_loss: True
  actor_rollout_ref.actor.kl_loss_coef: 0.001
  actor_rollout_ref.actor.entropy_coeff: 0.0
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.fsdp_config.param_offload: False
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: True

  # vLLM rollout server
  actor_rollout_ref.rollout.name: 'vllm'
  # Leave more headroom for actor/optimizer state to prevent CUDA OOM.
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.35

  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.ref.fsdp_config.param_offload: False

  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0

  # Logging: console + wandb
  trainer.logger: ['console', 'wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.default_local_dir: '${CHECKPOINT_DIR}'

  # Save a checkpoint every 2 epochs; validate every 2 epochs
  trainer.save_freq: 2
  trainer.test_freq: 2
  trainer.total_epochs: 5
