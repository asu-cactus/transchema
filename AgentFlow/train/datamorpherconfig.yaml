# datamorpherconfig.yaml
# Fine-tuning config for DataMorpher pipeline synthesis on Qwen2.5-7B-Instruct
# Run via:  python train/train_datamorpheragent.py

env:
  HF_HOME: "/scratch/general/vast/u1592362/hf_cache"
  # No OpenAI key needed — all components run locally on the vLLM-served Qwen
  # OPENAI_API_KEY: ""
  # CUDA_VISIBLE_DEVICES is NOT set here.  Ray manages per-worker GPU
  # assignment via placement groups.  Setting it globally causes NCCL
  # "Duplicate GPU detected" errors because all workers see the same
  # device list.  Use SLURM --gres or the shell environment to control
  # which physical GPUs are visible to the container.
  HYDRA_FULL_ERROR: 1
  N_GPUS: 2
  # The model to fine-tune (served by vLLM and used as the trainable planner)
  BASE_MODEL: 'Qwen/Qwen2.5-7B-Instruct'
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'DataMorpherAgent'
  PROJECT_NAME: 'DataMorpherAgent'
  # Path to the parquet files produced by prepare_rl_data.py
  BASE_DATA_DIR: 'train/data'
  VERBOSITY: 'DEBUG'
  N_WORKERS: 2

  # Full operator tool suite for DataMorpher pipeline synthesis.
  ENABLE_TOOLS: [
    "Configure_Join_Operator_Tool",
    "Configure_Union_Operator_Tool",
    "Configure_GroupBy_Aggregate_Operator_Tool",
    "Add_Pivot_Tool",
    "Add_Unpivot_Tool",
    "Code_Gen_And_Score_Tool",
    "Critique_Pipeline_Tool"
  ]

  # "trainable" routes the planner/verifier/executor through the local vLLM-served Qwen.
  # "Default" here means datamorpherrollout.py will replace it with the vllm-prefixed
  # model string so all operator tools also use the local Qwen — no GPT API key needed.
  TOOL_ENGINE: ["Default"]

  # [planner_main, planner_fixed, verifier, executor]
  # All four entries are "trainable" so every component routes through the same
  # local vLLM-served Qwen2.5-7B-Instruct — no external API calls at all.
  MODEL_ENGINE: ["trainable", "trainable", "trainable", "trainable"]

  # Pipeline synthesis typically resolves in 1-3 steps; keep low to avoid context overflow
  TOOL_STEPS: 3

  # Temperature schedule: explore during training, greedy at eval
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7

  # "final" mode returns the final generated pipeline code block
  OUTPUT_TYPE: "final"

  # Timeout per rollout in seconds (pipeline code gen + execution can take ~30-60 s)
  # Keep this low during training so slow/hanging trajectories don't stall a step.
  AGENT_MAX_TIMEOUT: 120

  # Paths to store checkpoints and rollout logs. Use scratch space if available.
  # We use env vars so the launch script can easily redirect these.
  CHECKPOINT_DIR: "/scratch/general/vast/u1592362/AgentFlow_Checkpoints"
  ROLLOUT_DIR: "/scratch/general/vast/u1592362/AgentFlow_Rollouts"

python_args:
  agentflow.port: 9999

  algorithm.adv_estimator: 'grpo'

  # Parquet files prepared by prepare_rl_data.py.
  # datamorphertrain_200.parquet is a reproducible 200-example subset of the
  # full 560-example dataset (random_state=42).  Use datamorphertrain.parquet
  # for a full production run.
  data.train_files: '${BASE_DATA_DIR}/train/datamorphertrain_200.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/datamorpherval.parquet'

  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'

  # Batch and rollout sizing for 2 GPUs (~95 GiB each, 190 GiB total)
  # 4 tasks × 4 rollouts = 16 sequences per step (GRPO works fine with this)
  data.train_batch_size: 4
  actor_rollout_ref.rollout.n: 4
  actor_rollout_ref.actor.ppo_mini_batch_size: 4
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 2
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 2

  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'

  # veRL sets vLLM max_model_len = max_prompt_length + max_response_length.
  # Qwen2.5-7B supports 128K; with VLLM_USE_V1=1 and param_offload=True,
  # the FSDP model is on CPU when vLLM initializes KV cache, so the full GPU
  # is available.  12288 + 1024 = 13312 tokens; use_remove_padding=True keeps fast.
  data.max_prompt_length: 12288
  data.max_response_length: 1024
  data.truncation: 'truncate'

  # Run a validation pass before the first training step to get a baseline score.
  # Disabled: the pre-train validation loads vLLM and runs full rollouts before
  # any gradient step, which can stall for hours on Blackwell GPUs.  Set to
  # True once training is confirmed stable end-to-end.
  trainer.val_before_train: False

  # Optimiser
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.model.use_remove_padding: True
  # KL loss against a frozen reference policy.
  #
  # DISABLED: the ref-policy's FSDP initialization triggers "Duplicate GPU
  # detected" in NCCL on this CHPC Apptainer setup, even with 2 GPUs
  # correctly visible.  The root cause is in how veRL's colocated
  # WorkerDict interacts with NCCL device detection inside Apptainer.
  #
  # Pure GRPO without KL is well-established (Shao et al., 2024) — the
  # clip_ratio_low/high (0.2/0.3) provide implicit trust-region
  # regularisation that prevents policy collapse.
  actor_rollout_ref.actor.use_kl_loss: False
  actor_rollout_ref.actor.kl_loss_coef: 0.0
  actor_rollout_ref.actor.entropy_coeff: 0.0
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  # FSDP param/optimizer offloading — REQUIRED for colocated vLLM wake_up.
  #
  # veRL's FSDPVLLMShardingManager shares GPUs between the FSDP training
  # actor (WorkerDict) and the vLLM rollout server (PatchedvLLMServer).
  # The sequence per step is:
  #   1. wake_up()  → vLLM reclaims GPU memory for model weights + KV cache
  #   2. rollout    → vLLM generates trajectories
  #   3. sleep()    → vLLM releases GPU memory back to FSDP
  #   4. train step → FSDP updates weights
  #
  # With param_offload=False, WorkerDict holds all model shards + gradients
  # + Adam states on GPU during step 1.  On this node that is ~66 GiB on
  # GPU 0, leaving no room for vLLM's 38 GiB reservation → wake_up() hangs
  # forever waiting for cuMemCreate to succeed.
  #
  # With param_offload=True + optimizer_offload=True, FSDPVLLMShardingManager
  # moves all FSDP state to CPU before calling wake_up(), so the GPU is
  # free for vLLM.  This is the intended usage per veRL PR #284.
  # CPU RAM on CHPC nodes is ample (256+ GB); the CPU↔GPU transfer adds
  # ~5–10 s per step, which is negligible compared to rollout time.
  actor_rollout_ref.actor.fsdp_config.param_offload: True
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: True

  # vLLM rollout server
  actor_rollout_ref.rollout.name: 'vllm'
  # With VLLM_USE_V1=1 (v1 engine, required by PatchedvLLMServer/AsyncLLM),
  # vLLM allocates KV cache with torch.zeros — physical GPU pages are reserved
  # immediately at init time.  With param_offload=True, the FSDP model is on
  # CPU by the time vLLM calls initialize_kv_cache, so the full GPU is
  # available.  However vLLM v1 computes available_memory = min(free, util×total)
  # and uses that budget for both model weights + KV cache tensors.
  # 0.4 × 94.97 GiB ≈ 38 GiB: enough for Qwen2.5-7B weights (~14.5 GiB) plus
  # ~23 GiB of KV cache, which supports long DataMorpher prompts.
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.4

  # Ref-policy settings (only used when use_kl_loss=True above).
  # param_offload=True on the ref policy so it doesn't compete for GPU
  # memory with the actor's vLLM rollout server during wake_up.
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.ref.fsdp_config.param_offload: True

  # KL-in-reward also disabled (requires ref-policy worker).
  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0

  # Logging: console + wandb
  trainer.logger: ['console', 'wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.default_local_dir: '${CHECKPOINT_DIR}'

  # Save a checkpoint every 10 steps; validate every epoch (50 steps).
  # With 200 training examples and batch_size=4, each epoch = 50 steps.
  # save_freq is in steps (iterations), so 10 steps ≈ every ~2 hours on
  # 2 GPUs.  This ensures progress is not lost if the cluster hits a time limit.
  trainer.save_freq: 10
  trainer.test_freq: 50
  trainer.total_epochs: 5
  # To resume after a cluster time limit, add this on the next submission:
  #   +trainer.resume_mode=auto
  # veRL will automatically load the latest checkpoint from trainer.default_local_dir.
  # resume_mode options: 'auto' (load latest), 'disable' (fresh start),
  #                      or a specific folder name e.g. 'global_step_10'
